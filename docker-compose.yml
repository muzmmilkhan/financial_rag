services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      EURI_GEMINI_API_KEY: ${EURI_GEMINI_API_KEY:-${GEMINI_API_KEY}}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generative.googleapis.com/v1beta2}
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
